<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>
  <!-- Certificate border & background -->
  <rect width="640" height="440" rx="8" fill="url(#certBg)" stroke="#0284c7" stroke-width="6" />
  <rect x="12" y="12" width="616" height="416" rx="4" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4" />

  <!-- Cisco Academy Logo placeholder / header -->
  <g transform="translate(40, 36)">
    <!-- Cisco bars -->
    <rect x="0" y="16" width="4" height="14" fill="#0284c7" rx="1"/>
    <rect x="8" y="10" width="4" height="20" fill="#0284c7" rx="1"/>
    <rect x="16" y="4" width="4" height="26" fill="#0284c7" rx="1"/>
    <rect x="24" y="0" width="4" height="30" fill="#0284c7" rx="1"/>
    <rect x="32" y="4" width="4" height="26" fill="#0284c7" rx="1"/>
    <rect x="40" y="10" width="4" height="20" fill="#0284c7" rx="1"/>
    <rect x="48" y="16" width="4" height="14" fill="#0284c7" rx="1"/>
    <text x="64" y="24" fill="#0f172a" font-family="'Inter', sans-serif" font-size="16" font-weight="800" letter-spacing="1">CISCO</text>
    <text x="125" y="24" fill="#64748b" font-family="'Inter', sans-serif" font-size="14" font-weight="500">Networking Academy</text>
  </g>

  <!-- Certificate Body -->
  <text x="320" y="120" fill="#64748b" font-family="'Inter', sans-serif" font-size="13" text-anchor="middle" letter-spacing="2">THIS IS TO CERTIFY THAT</text>
  <text x="320" y="165" fill="#0369a1" font-family="'Inter', serif" font-size="28" font-weight="bold" text-anchor="middle">Jeverly Shane B. Capote</text>
  
  <line x1="160" y1="180" x2="480" y2="180" stroke="#0284c7" stroke-width="1.5" />

  <text x="320" y="210" fill="#475569" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">has successfully completed the course requirements for</text>
  
  <text x="320" y="245" fill="#0f172a" font-family="'Inter', sans-serif" font-size="18" font-weight="700" text-anchor="middle">CCNA: Switching, Routing, and Wireless Essentials</text>
  
  <text x="320" y="275" fill="#64748b" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">offered through Davao del Norte State College Cisco Networking Academy</text>

  <!-- Security / Badge stamp -->
  <g transform="translate(320, 340)">
    <circle cx="0" cy="0" r="32" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
    <path d="M-12 -2 L-4 6 L12 -10" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="22" fill="#15803d" font-family="'Inter', sans-serif" font-size="8" font-weight="bold" text-anchor="middle">VERIFIED</text>
  </g>

  <!-- Signatures / Footer -->
  <g transform="translate(100, 380)">
    <line x1="0" y1="0" x2="140" y2="0" stroke="#94a3b8" stroke-width="1" />
    <text x="70" y="16" fill="#64748b" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Academy Instructor</text>
    <text x="70" y="30" fill="#0f172a" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Davao del Norte State College</text>
  </g>

  <g transform="translate(400, 380)">
    <line x1="0" y1="0" x2="140" y2="0" stroke="#94a3b8" stroke-width="1" />
    <text x="70" y="16" fill="#64748b" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Issue Date</text>
    <text x="70" y="30" fill="#0f172a" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Academic Year 2024–2025</text>
  </g>
</svg>
