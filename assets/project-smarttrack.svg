  <rect x="64" y="130" width="30" height="30" fill="#0f172a" />
  <rect x="134" y="130" width="30" height="30" fill="#0f172a" />
  <rect x="64" y="200" width="30" height="30" fill="#0f172a" />
  <rect x="104" y="170" width="20" height="20" fill="#8b5cf6" />
  <text x="114" y="265" fill="#38bdf8" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="600">Scan Student ID</text>
  <text x="114" y="282" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Real-time Sync Active</text>

  <!-- Right: Analytics Chart Dashboard -->
  <rect x="220" y="60" width="356" height="125" rx="10" fill="#131b2e" stroke="#334155" stroke-width="1" />
