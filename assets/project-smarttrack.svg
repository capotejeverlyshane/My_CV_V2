  <line x1="240" y1="160" x2="550" y2="160" stroke="#334155" stroke-width="1" />
  <rect x="260" y="120" width="22" height="40" rx="4" fill="#6366f1" />
  <rect x="300" y="95" width="22" height="65" rx="4" fill="#8b5cf6" />
  <rect x="340" y="80" width="22" height="80" rx="4" fill="#a855f7" />
  <rect x="380" y="110" width="22" height="50" rx="4" fill="#ec4899" />
  <rect x="420" y="130" width="22" height="30" rx="4" fill="#f43f5e" />
  <rect x="460" y="100" width="22" height="60" rx="4" fill="#06b6d4" />
  <rect x="500" y="90" width="22" height="70" rx="4" fill="#10b981" />

