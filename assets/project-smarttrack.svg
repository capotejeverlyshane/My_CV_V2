  <text x="236" y="224" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">Live Check-in Log</text>
  <text x="236" y="250" fill="#94a3b8" font-family="monospace" font-size="10">08:01:14 • Capote, Jeverly Shane [BSIT 4D] - Present</text>
  <text x="236" y="272" fill="#94a3b8" font-family="monospace" font-size="10">08:02:45 • Solamillo, Rey [BSIT 4A] - Present</text>
