<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="riskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="12" fill="url(#riskGrad)"/>
  
  <!-- Left Phone Mockup: Emergency Contacts & Hotlines -->
  <g transform="translate(60, 25)">
    <rect width="180" height="310" rx="24" fill="#0b0f19" stroke="#334155" stroke-width="2"/>
    <rect x="55" y="8" width="70" height="12" rx="6" fill="#1e293b"/>
    <!-- App Header -->
    <rect x="14" y="28" width="152" height="34" rx="8" fill="url(#redGrad)"/>
    <text x="90" y="49" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">RiskReady</text>
    <text x="90" y="58" fill="#ffffff" font-family="'Inter', sans-serif" font-size="7.5" opacity="0.9" text-anchor="middle">Emergency Preparedness</text>

    <!-- Emergency Hotline Cards -->
    <rect x="14" y="70" width="152" height="38" rx="6" fill="#1e293b"/>
    <circle cx="28" cy="89" r="10" fill="#ef4444"/>
    <text x="28" y="93" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">911</text>
    <text x="44" y="85" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="9" font-weight="bold">National Emergency</text>
    <text x="44" y="97" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="7.5">24/7 Hotline Service</text>

    <rect x="14" y="114" width="152" height="38" rx="6" fill="#1e293b"/>
    <circle cx="28" cy="133" r="10" fill="#f59e0b"/>
    <text x="28" y="137" fill="#ffffff" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">BFP</text>
    <text x="44" y="129" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="9" font-weight="bold">Bureau of Fire Protection</text>
    <text x="44" y="141" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="7.5">Panabo Fire Station</text>

    <rect x="14" y="158" width="152" height="38" rx="6" fill="#1e293b"/>
    <circle cx="28" cy="177" r="10" fill="#10b981"/>
    <text x="28" y="181" fill="#ffffff" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">PRC</text>
    <text x="44" y="173" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="9" font-weight="bold">Philippine Red Cross</text>
    <text x="44" y="185" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="7.5">First Aid &amp; Rescue</text>

    <!-- Quick First Aid Guides section -->
    <rect x="14" y="202" width="152" height="85" rx="8" fill="#182234" stroke="#334155" stroke-width="1"/>
    <text x="22" y="218" fill="#ef4444" font-family="'Inter', sans-serif" font-size="8.5" font-weight="bold">FIRST AID LITERACY</text>
    <text x="22" y="234" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="8">✓ CPR Step-by-Step</text>
    <text x="22" y="248" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="8">✓ Burns &amp; Wounds Care</text>
    <text x="22" y="262" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="8">✓ Earthquake Safety Tips</text>
    <text x="22" y="276" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="8">✓ Flood Evacuation Protocol</text>
  </g>

  <!-- Right Phone Mockup: First Aid Guide Detail -->
  <g transform="translate(280, 25)">
    <rect width="180" height="310" rx="24" fill="#0b0f19" stroke="#334155" stroke-width="2"/>
    <rect x="55" y="8" width="70" height="12" rx="6" fill="#1e293b"/>
    
    <rect x="14" y="28" width="152" height="30" rx="6" fill="#1e293b"/>
    <text x="90" y="47" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">Emergency Guide: Burns</text>
    
    <!-- Step cards -->
    <rect x="14" y="66" width="152" height="52" rx="6" fill="#1c2538"/>
    <circle cx="26" cy="80" r="8" fill="#ef4444"/>
    <text x="26" y="84" fill="#ffffff" font-family="'Inter', sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">1</text>
    <text x="40" y="80" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="8.5" font-weight="bold">Cool the Burn</text>
    <text x="40" y="93" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="7.5">Hold under cool running</text>
    <text x="40" y="103" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="7.5">water for 10-15 minutes.</text>

    <rect x="14" y="124" width="152" height="52" rx="6" fill="#1c2538"/>
    <circle cx="26" cy="138" r="8" fill="#f59e0b"/>
    <text x="26" y="142" fill="#ffffff" font-family="'Inter', sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">2</text>
    <text x="40" y="138" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="8.5" font-weight="bold">Protect and Cover</text>
    <text x="40" y="151" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="7.5">Cover loosely with a clean,</text>
    <text x="40" y="161" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="7.5">sterile bandage.</text>

    <rect x="14" y="182" width="152" height="52" rx="6" fill="#1c2538"/>
    <circle cx="26" cy="196" r="8" fill="#10b981"/>
    <text x="26" y="200" fill="#ffffff" font-family="'Inter', sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">3</text>
    <text x="40" y="196" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="8.5" font-weight="bold">Call Assistance</text>
    <text x="40" y="209" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="7.5">Call Red Cross / 911 for</text>
    <text x="40" y="219" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="7.5">severe or blistered burns.</text>

    <rect x="14" y="246" width="152" height="40" rx="8" fill="url(#redGrad)"/>
    <text x="90" y="271" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Call Hotline Now</text>
  </g>

  <!-- Floating Feature callout on right -->
  <rect x="475" y="70" width="115" height="75" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="532" y="92" fill="#ef4444" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">OFFLINE READY</text>
  <text x="532" y="108" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="7.5" text-anchor="middle">Critical guides accessible</text>
  <text x="532" y="120" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="7.5" text-anchor="middle">without internet.</text>

  <rect x="475" y="160" width="115" height="75" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="532" y="182" fill="#10b981" font-family="'Inter', sans-serif" font-size="9" font-weight="bold" text-anchor="middle">FAVORITES</text>
  <text x="532" y="198" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="7.5" text-anchor="middle">Pin family &amp; local</text>
  <text x="532" y="210" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="7.5" text-anchor="middle">emergency responders.</text>
</svg>
