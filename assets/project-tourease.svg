<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="tourGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="12" fill="url(#tourGrad)"/>
  
  <!-- Browser mockup -->
  <rect x="25" y="25" width="550" height="310" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <rect x="25" y="25" width="550" height="34" rx="10" fill="#090d16"/>
  <rect x="25" y="45" width="550" height="14" fill="#090d16"/>
  <circle cx="45" cy="42" r="5" fill="#ef4444"/>
  <circle cx="62" cy="42" r="5" fill="#f59e0b"/>
  <circle cx="79" cy="42" r="5" fill="#10b981"/>
  <rect x="180" y="33" width="240" height="18" rx="6" fill="#1e293b"/>
  <text x="300" y="46" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9.5" text-anchor="middle">tourease.app • Built with Expo &amp; React Native</text>

  <!-- Hero Banner -->
  <rect x="45" y="70" width="510" height="100" rx="8" fill="url(#sunGrad)"/>
  <text x="70" y="105" fill="#ffffff" font-family="'Inter', sans-serif" font-size="18" font-weight="800">TourEase Travel Companion</text>
  <text x="70" y="125" fill="#e0f2fe" font-family="'Inter', sans-serif" font-size="11">Discover Davao Region &amp; Panabo City eco-tourism spots with personalized itineraries.</text>
  <rect x="70" y="136" width="105" height="24" rx="12" fill="#ffffff"/>
  <text x="122" y="152" fill="#0284c7" font-family="'Inter', sans-serif" font-size="9.5" font-weight="bold" text-anchor="middle">Explore Destinations</text>

  <!-- Destination Cards Grid -->
  <g transform="translate(45, 185)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="160" height="135" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="0" y="0" width="160" height="70" rx="8" fill="#0369a1"/>
    <text x="80" y="42" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Samal Island</text>
    <text x="12" y="90" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="10" font-weight="bold">Coastal Beach Tour</text>
    <text x="12" y="104" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="8.5">★ 4.9 (184 reviews)</text>
    <text x="12" y="120" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8">Ferry &amp; Resort bookings</text>

    <!-- Card 2 -->
    <rect x="175" y="0" width="160" height="135" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="175" y="0" width="160" height="70" rx="8" fill="#065f46"/>
    <text x="255" y="42" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Marilog Highlands</text>
    <text x="187" y="90" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="10" font-weight="bold">Mountain &amp; Pine Escapes</text>
    <text x="187" y="104" fill="#34d399" font-family="'Inter', sans-serif" font-size="8.5">★ 4.8 (120 reviews)</text>
    <text x="187" y="120" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8">Campgrounds &amp; Viewdecks</text>

    <!-- Card 3: Expo Live Build Banner -->
    <rect x="350" y="0" width="160" height="135" rx="8" fill="#182234" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="365" y="14" width="130" height="26" rx="6" fill="#0284c7"/>
    <text x="430" y="31" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Expo Dev Build</text>
    <text x="430" y="65" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Cross-Platform</text>
    <text x="430" y="80" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="8" text-anchor="middle">iOS • Android • Web</text>
    <rect x="375" y="95" width="110" height="24" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="430" y="111" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">Live on Expo</text>
  </g>
</svg>
