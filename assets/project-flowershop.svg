<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="roseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="50%" stop-color="#ffe4e6" />
      <stop offset="100%" stop-color="#fecdd3" />
    </linearGradient>
    <radialGradient id="rosePetal1" cx="65%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="70%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </radialGradient>
    <radialGradient id="rosePetal2" cx="75%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="80%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </radialGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
  </defs>

  <!-- Background with delicate rose floral aesthetic -->
  <rect width="600" height="360" rx="12" fill="url(#roseBg)"/>

  <!-- Floral Artwork in the background -->
  <g transform="translate(40, -10)">
    <!-- Stem and leaves -->
    <path d="M420 220 Q 380 290 310 370" fill="none" stroke="url(#stemGrad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M370 260 Q 320 240 330 280 Z" fill="#16a34a" opacity="0.85"/>
    <path d="M450 180 Q 420 270 380 370" fill="none" stroke="url(#stemGrad)" stroke-width="7" stroke-linecap="round"/>
    <path d="M410 240 Q 450 220 440 260 Z" fill="#15803d" opacity="0.85"/>

    <!-- Rose 1 -->
    <ellipse cx="440" cy="130" rx="42" ry="60" fill="url(#rosePetal1)" transform="rotate(15 440 130)"/>
    <ellipse cx="420" cy="140" rx="36" ry="52" fill="url(#rosePetal2)" transform="rotate(-10 420 140)"/>
    <path d="M 410 110 C 430 90, 460 100, 450 140 C 440 170, 410 160, 410 110 Z" fill="#f43f5e" opacity="0.9"/>
    
    <!-- Rose 2 -->
    <ellipse cx="370" cy="180" rx="46" ry="58" fill="url(#rosePetal1)" transform="rotate(-25 370 180)"/>
    <ellipse cx="390" cy="190" rx="38" ry="50" fill="url(#rosePetal2)" transform="rotate(12 390 190)"/>
  </g>

  <!-- Centered Glassmorphic Sign Up Card -->
  <rect x="180" y="45" width="240" height="270" rx="16" fill="rgba(30, 41, 59, 0.72)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
  
  <text x="300" y="86" fill="#ffffff" font-family="'Inter', sans-serif" font-size="18" font-weight="700" text-anchor="middle">Sign up</text>

  <!-- Input 1: Full Name -->
  <rect x="202" y="108" width="196" height="30" rx="6" fill="rgba(15, 23, 42, 0.55)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
  <text x="216" y="127" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9.5">Full Name</text>

  <!-- Input 2: Email -->
  <rect x="202" y="148" width="196" height="30" rx="6" fill="rgba(15, 23, 42, 0.55)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
  <text x="216" y="167" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9.5">Email</text>

  <!-- Input 3: Password -->
  <rect x="202" y="188" width="196" height="30" rx="6" fill="rgba(15, 23, 42, 0.55)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
  <text x="216" y="207" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9.5">Password</text>

  <!-- Sign Up Button -->
  <rect x="202" y="232" width="196" height="32" rx="6" fill="#0f172a" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
  <text x="300" y="252" fill="#ffffff" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Sign up</text>

  <!-- Login Link -->
  <text x="300" y="286" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Login</text>
  
  <!-- Subtle System Caption -->
  <rect x="0" y="328" width="600" height="32" rx="0" fill="rgba(15, 23, 42, 0.85)"/>
  <text x="300" y="348" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="9.5" text-anchor="middle">Flower Shop System • Web-based Florist Inventory &amp; Ordering Management</text>
</svg>
