<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="netGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#111c38" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="12" fill="url(#netGrad)" />
  <rect width="600" height="38" rx="12" fill="#060b17" />
  <rect y="26" width="600" height="12" fill="#060b17" />
  <circle cx="24" cy="19" r="6" fill="#ef4444" />
  <circle cx="44" cy="19" r="6" fill="#f59e0b" />
  <circle cx="64" cy="19" r="6" fill="#10b981" />
  <text x="300" y="24" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Cisco Packet Tracer - Campus Enterprise Network Topology</text>

  <!-- Network Grid Lines -->
  <line x1="150" y1="120" x2="300" y2="90" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
  <line x1="450" y1="120" x2="300" y2="90" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
  <line x1="150" y1="120" x2="100" y2="240" stroke="#10b981" stroke-width="2" />
  <line x1="150" y1="120" x2="200" y2="240" stroke="#10b981" stroke-width="2" />
  <line x1="450" y1="120" x2="400" y2="240" stroke="#10b981" stroke-width="2" />
  <line x1="450" y1="120" x2="500" y2="240" stroke="#10b981" stroke-width="2" />
  <line x1="150" y1="120" x2="450" y2="120" stroke="#f59e0b" stroke-width="2" />

  <!-- Core Router -->
  <circle cx="300" cy="90" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
  <text x="300" y="93" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ROUTER-01</text>
  <text x="300" y="104" fill="#94a3b8" font-family="sans-serif" font-size="8" text-anchor="middle">OSPF Area 0</text>

  <!-- Distribution Switches -->
  <rect x="120" y="105" width="60" height="30" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2" />
  <text x="150" y="124" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">DSW-Admin</text>

  <rect x="420" y="105" width="60" height="30" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="2" />
  <text x="450" y="124" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">DSW-Lab</text>

  <!-- Access Switches / Endpoints -->
  <circle cx="100" cy="240" r="16" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
  <text x="100" y="244" fill="#cbd5e1" font-family="sans-serif" font-size="8" text-anchor="middle">VLAN 10</text>
  <text x="100" y="268" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Faculty PCs</text>

  <circle cx="200" cy="240" r="16" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
  <text x="200" y="244" fill="#cbd5e1" font-family="sans-serif" font-size="8" text-anchor="middle">VLAN 20</text>
  <text x="200" y="268" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">VoIP Phones</text>

  <circle cx="400" cy="240" r="16" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
  <text x="400" y="244" fill="#cbd5e1" font-family="sans-serif" font-size="8" text-anchor="middle">VLAN 30</text>
  <text x="400" y="268" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">IT Lab 1</text>

  <circle cx="500" cy="240" r="16" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
  <text x="500" y="244" fill="#cbd5e1" font-family="sans-serif" font-size="8" text-anchor="middle">VLAN 40</text>
  <text x="500" y="268" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">Wi-Fi APs</text>

  <!-- Console Log / Terminal preview at bottom -->
  <rect x="60" y="290" width="480" height="50" rx="6" fill="#050811" stroke="#1e293b" stroke-width="1" />
  <text x="75" y="310" fill="#10b981" font-family="monospace" font-size="9.5">Switch-Core# show ip route | include OSPF</text>
  <text x="75" y="326" fill="#94a3b8" font-family="monospace" font-size="9">O    192.168.10.0/24 [110/2] via 10.1.1.2, GigabitEthernet0/0/1 [Configured]</text>
</svg>
